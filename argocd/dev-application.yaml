apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vishva-ux/cloud-native-gitops-delivery-platform.git
    targetRevision: HEAD
    path: helm/platform
    helm:
      valueFiles:
        - ../values/values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
