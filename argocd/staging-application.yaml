apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vishva-ux/cloud-native-gitops-delivery-platform.git
    targetRevision: HEAD
    path: helm/platform
    helm:
      valueFiles:
        - ../values/values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
